<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Focus Guard</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>YouTube Focus Guard</h1>
      <button id="open-settings" title="Settings">Settings</button>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="time">Time Spent</button>
      <button class="tab" data-tab="history">History</button>
    </nav>

    <section id="view-time" class="view active">
      <div class="summary">
        <div class="stat">
          <span id="today-unnecessary" class="stat-value">0m</span>
          <span class="stat-label">Unnecessary today</span>
        </div>
        <div class="stat">
          <span id="today-educational" class="stat-value">0m</span>
          <span class="stat-label">Educational today</span>
        </div>
      </div>

      <p id="threshold-status" class="hint"></p>

      <h2>Top "unnecessary" videos today</h2>
      <ul id="today-videos" class="video-list"></ul>

      <h2>Last 7 days (unnecessary)</h2>
      <ul id="week-days" class="day-list"></ul>
    </section>

    <section id="view-history" class="view">
      <ul id="history-list" class="video-list"></ul>
    </section>

    <footer>
      <button id="clear-data">Clear tracked time data</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
